<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoResearch 论文自动化系统</title>
<style>
  :root{--ink:#1f2530;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f6f9;--card:#fff;
        --accent:#2563eb;--accent2:#1e40af;--ok:#16a34a;--bad:#dc2626;--warn:#ea580c;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.65}
  header{background:linear-gradient(120deg,#1e3a8a,#2563eb);color:#fff;padding:18px 26px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header h1{margin:0;font-size:19px;font-weight:800}
  header p{margin:4px 0 0;font-size:13px;opacity:.85}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:320px 1fr;gap:22px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .panel h3{margin:0 0 12px;font-size:15px;font-weight:700}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  button{cursor:pointer;border:none;border-radius:9px;font-size:14px;font-weight:700;padding:10px 14px;transition:.15s}
  .btn-run{background:var(--accent);color:#fff;width:100%;margin-top:14px}
  .btn-run:hover{background:var(--accent2)}
  .btn-run:disabled{background:#9aa6b2;cursor:not-allowed}
  .btn-open{background:#eef2ff;color:var(--accent2);width:100%;margin-top:10px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .term{background:#0f172a;color:#cbd5e1;border-radius:10px;padding:12px;height:200px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;margin-top:10px}
  /* 结果区 */
  .result{min-height:300px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tabpane{display:none}
  .tabpane.active{display:block}
  .empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px}
  /* 论文渲染 */
  .doc{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:34px 40px}
  .doc h1.doc-title{font-size:22px;font-weight:800;text-align:center;margin:0 0 22px}
  .doc h2.chapter{font-size:19px;font-weight:700;margin:30px 0 8px;padding-left:12px;border-left:5px solid var(--accent)}
  .doc h2.section-h2,.doc h2.toc-title{font-size:17px;font-weight:700;margin:24px 0 6px}
  .doc h3{font-size:15px;font-weight:600;margin:16px 0 5px}
  .doc p{margin:9px 0;text-align:justify}
  .doc sup.cite{color:var(--accent);font-size:11px;font-weight:600}
  .doc ul.toc{list-style:none;padding-left:0;columns:2;column-gap:30px}
  .doc ul.toc li{padding:3px 0;color:#444;font-size:13.5px;border-bottom:1px dotted #ddd}
  .doc blockquote{background:#f0f4fb;border-left:4px solid var(--accent);margin:10px 0;padding:8px 14px;color:#444}
  /* 评分卡 */
  .verdict-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:16px}
  .verdict-top{display:flex;align-items:center;gap:20px;margin-bottom:14px}
  .score-big{font-size:44px;font-weight:800;color:var(--accent);min-width:88px;text-align:center}
  .verdict-label{font-size:13px;color:var(--muted)}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:700;margin-right:6px}
  .badge.ok{background:#e6f4ea;color:var(--ok)}
  .badge.bad{background:#fdecea;color:var(--bad)}
  .badge.lit{background:#fce4ec;color:#ad1457}
  .dims{display:grid;grid-template-columns:1fr 1fr;gap:9px 24px}
  .dim-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
  .dim-head b{color:var(--accent)}
  .bar{height:8px;background:#eee;border-radius:6px;overflow:hidden}
  .bar-fill{height:100%}
  .issues{margin-top:12px;font-size:13px;color:var(--warn)}
  /* 列表 */
  .list-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .list-item .t{font-weight:600}
  .list-item .m{color:var(--muted);font-size:12px}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .kpi{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
  .kpi .k{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:18px;font-weight:800;color:var(--accent2)}
  .plots img{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;margin-bottom:14px}
  .status{font-size:13px;font-weight:700;margin:6px 0 0}
  .status.running{color:var(--warn)}
  .status.done{color:var(--ok)}
  .status.failed{color:var(--bad)}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>AutoResearch · 多智能体论文自动化系统</h1>
  <p>填研究主题 → 一键跑流水线（抓文献→确定性实验→生成论文→AI 评分）→ 网页直接看结果</p>
</header>

<div class="wrap">
  <!-- 控制面板 -->
  <div class="panel">
    <h3>运行控制</h3>
    <label>模式</label>
    <select id="mode">
      <option value="plan">plan · 单次（主题→spec→论文）</option>
      <option value="iterate">iterate · 多轮迭代（扩宽数据集/方法）</option>
    </select>

    <label>API Key <span style="color:var(--muted);font-weight:400">（必填·仅本次运行使用，不保存）</span></label>
    <input id="apikey" type="password" placeholder="粘贴你的 DeepSeek / 兼容网关 Key，如 sk-..." autocomplete="off">

    <label>研究主题</label>
    <textarea id="topic" placeholder="例：基于集成学习算法的乳腺癌良恶性诊断研究"></textarea>

    <label>数据集（可选，留空由 Planner 自动选）</label>
    <select id="dataset"><option value="">— 自动选择 —</option></select>

    <div class="row" id="roundsRow">
      <div style="flex:1">
        <label>迭代轮数</label>
        <input id="rounds" type="number" value="3" min="1" max="6">
      </div>
    </div>

    <button class="btn-run" id="runBtn">▶ 运行流水线</button>
    <div class="hint">无需安装任何环境：填 Key → 填主题 → 点运行。运行期间请保持本页面打开。</div>

    <hr style="border:none;border-top:1px dashed var(--line);margin:18px 0">
    <h3 style="margin-bottom:8px">打开已有结果</h3>
    <input id="openDir" placeholder="产物目录，如 out_eval3/round_1 或 out_web/task_0001">
    <button class="btn-open" id="openBtn">📂 加载并查看</button>
    <button class="btn-demo" id="demoBtn" style="margin-left:8px">✨ 载入演示成果</button>
    <div class="hint">直接读取本地已生成产物，无需重新运行（可避开 API 限流）。点「载入演示成果」可一键查看已生成的示例论文（综合 97.8 分）。</div>

    <div class="status" id="status"></div>
    <div class="term" id="term"></div>
  </div>

  <!-- 结果区 -->
  <div class="panel result">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="paper">论文</div>
      <div class="tab" data-tab="verdict">评分</div>
      <div class="tab" data-tab="lit">文献</div>
      <div class="tab" data-tab="exp">实验</div>
      <div class="tab" data-tab="plots">图表</div>
    </div>
    <div id="tabbody">
      <div class="empty">还没有结果。填好左侧主题点「运行流水线」，或「打开已有结果」查看 out_eval3 等产物。</div>
    </div>
  </div>
</div>

<script>
const API = "";
let pollTimer = null;

function el(id){return document.getElementById(id);}
function setStatus(text, cls){const s=el('status'); s.textContent=text; s.className='status '+(cls||'');}

// 拉数据集列表
fetch(API+'/api/datasets').then(r=>r.json()).then(d=>{
  const sel=el('dataset');
  (d.datasets||[]).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});
}).catch(()=>{});

// 选项卡
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const pane=el('pane-'+t.dataset.tab);
  if(pane) pane.classList.add('active');
});

el('mode').onchange=()=>{ el('roundsRow').style.display = el('mode').value==='iterate'?'flex':'none'; };
el('mode').dispatchEvent(new Event('change'));

el('runBtn').onclick=()=>{
  const topic=el('topic').value.trim();
  const apikey=el('apikey').value.trim();
  if(!topic){alert('请填写研究主题');return;}
  if(!apikey){alert('请填入你的 API Key（仅本次运行使用，不会保存）');return;}
  const body={mode:el('mode').value, topic, dataset:el('dataset').value, rounds:parseInt(el('rounds').value||'3',10), api_key:apikey};
  el('runBtn').disabled=true; el('term').textContent='';
  setStatus('运行中…','running');
  fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{
      if(d.error){setStatus('错误：'+d.error,'failed');el('runBtn').disabled=false;return;}
      pollTask(d.task_id);
    }).catch(e=>{setStatus('请求失败：'+e,'failed');el('runBtn').disabled=false;});
};

el('openBtn').onclick=()=>{
  const dir=el('openDir').value.trim();
  if(!dir){alert('请填写要打开的目录');return;}
  setStatus('加载中…','running');
  fetch(API+'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'open',dir})})
    .then(r=>r.json()).then(d=>{ if(d.task_id) loadResult(d.task_id); else setStatus('加载失败','failed'); })
    .catch(e=>setStatus('请求失败：'+e,'failed'));
};

el('demoBtn').onclick=()=>{
  el('openDir').value='demo_results/out_eval3/round_1';
  el('openBtn').click();
};

function pollTask(id){
  pollTimer=setInterval(()=>{
    fetch(API+'/api/task?id='+encodeURIComponent(id)).then(r=>r.json()).then(t=>{
      el('term').textContent=t.log.join('\n');
      el('term').scrollTop=el('term').scrollHeight;
      if(t.status==='done'){clearInterval(pollTimer);setStatus('完成 ✓','done');el('runBtn').disabled=false;loadResult(id);}
      else if(t.status==='failed'){clearInterval(pollTimer);setStatus('失败 ✗','failed');el('runBtn').disabled=false;}
    });
  },1500);
}

function loadResult(id){
  fetch(API+'/api/result?id='+encodeURIComponent(id)).then(r=>r.json()).then(d=>{
    if(!d.found){setStatus('未找到论文产物：'+(d.error||''),'failed');return;}
    renderResult(d);
  }).catch(e=>setStatus('加载失败：'+e,'failed'));
}

function renderResult(d){
  const tabs=el('tabs');
  // 构建 tab body
  let html='';
  // 论文
  html+=`<div class="tabpane active" id="pane-paper"><div class="doc">${d.paper_html||'(无正文)'}</div></div>`;
  // 评分
  html+=`<div class="tabpane" id="pane-verdict">${d.verdict_html||'<div class="empty">无评分数据</div>'}</div>`;
  // 文献
  let lit='';
  (d.literature||[]).forEach(c=>{
    const title=c.title||'(无标题)';
    const meta=[c.authors,c.venue,c.year].filter(Boolean).join(' · ');
    lit+=`<div class="list-item"><div class="t">${esc(title)}</div><div class="m">${esc(meta)}</div></div>`;
  });
  html+=`<div class="tabpane" id="pane-lit">${lit||'<div class="empty">无文献</div>'}</div>`;
  // 实验
  let exp='';
  if(d.experiment){
    const e=d.experiment;
    const kpis=[['最优方法',e.best_method],['主指标',e.metric],['任务类型',e.task_type]];
    if(e.seed_variance!=null) kpis.push(['多种子方差',e.seed_variance]);
    if(e.train_test_gap!=null) kpis.push(['训练-测试差距',e.train_test_gap]);
    exp+='<div class="kv">'+kpis.map(k=>`<div class="kpi"><div class="k">${esc(k[0])}</div><div class="v">${esc(String(k[1]))}</div></div>`).join('')+'</div>';
    if(e.sub_hypothesis_evidence){
      exp+='<h3 style="margin-top:16px">子假设裁决</h3>';
      for(const [k,v] of Object.entries(e.sub_hypothesis_evidence)){
        exp+=`<div class="list-item"><div class="t">${esc(k)}</div><div class="m">${esc(typeof v==='object'?JSON.stringify(v):String(v))}</div></div>`;
      }
    }
  }
  html+=`<div class="tabpane" id="pane-exp">${exp||'<div class="empty">无实验数据</div>'}</div>`;
  // 图表
  let pl='';
  (d.plots_rel||[]).forEach(p=>{ pl+=`<img src="${API}/api/file?path=${encodeURIComponent(p)}" alt="plot">`; });
  html+=`<div class="tabpane" id="pane-plots">${pl||'<div class="empty">无图表</div>'}</div>`;

  el('tabbody').innerHTML=html;
  setStatus('已加载结果','done');
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
</script>
</body>
</html>
